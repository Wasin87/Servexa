<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask for negative space (circle + handle slits) -->
    <mask id="pinCutout">
      <rect width="100" height="100" fill="white" />
      <!-- Central circle window -->
      <circle cx="50" cy="46" r="28" fill="black" />
      <!-- Two slits flanking the handle at 45 deg -->
      <g transform="translate(50, 46) rotate(-45)">
        <!-- Handle is y = -4.5 to +4.5 (width 9) -->
        <!-- Slit 1 (top of handle): y from -9 to -4.5 -->
        <rect x="-42" y="-9" width="22" height="4.5" fill="black" />
        <!-- Slit 2 (bottom of handle): y from 4.5 to 9 -->
        <rect x="-42" y="4.5" width="22" height="4.5" fill="black" />
      </g>
    </mask>

    <mask id="wrenchJawMask">
      <rect x="-50" y="-50" width="100" height="100" fill="white" />
      <!-- Jaw slot cutout in +X direction (up-right) -->
      <circle cx="8" cy="0" r="5.8" fill="black" />
      <rect x="8" y="-5.8" width="16" height="11.6" rx="1" fill="black" />
    </mask>
  </defs>

  <!-- 1. The Pin/House Body with mask -->
  <path
    d="M 50 4
       L 12 36
       L 15 39.5
       C 19 38 19.5 44 19.5 50
       C 19.5 62 36 78 50 96
       C 64 78 80.5 62 80.5 50
       C 80.5 44 81 38 85 39.5
       L 88 36
       L 75 25.5
       L 75 11
       L 65 11
       L 65 17.5
       Z"
    fill="#FA4D00"
    mask="url(#pinCutout)"
  />

  <!-- 2. Orange Wrench inside and entering from lower-left -->
  <g transform="translate(50, 46) rotate(-45)">
    <!-- Handle -->
    <rect x="-38" y="-4.5" width="46" height="9" fill="#FA4D00" />
    <!-- Head with jaw cutout -->
    <g mask="url(#wrenchJawMask)">
      <circle cx="8" cy="0" r="11.5" fill="#FA4D00" />
    </g>
  </g>
</svg>